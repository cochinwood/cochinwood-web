<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f4f1e8"/><style>text{font-family:Arial,sans-serif;fill:#1b4332} .h{font-size:38px;font-weight:700}.t{font-size:25px}.s{font-size:21px;fill:#496451}.line{stroke:#1b4332;stroke-width:3;fill:none}.dim{stroke:#58775e;stroke-width:2;fill:none}</style><text x="60" y="76" class="h">Two limits shape a container load</text><rect x="70" y="200" width="490" height="260" fill="#e0e6db" stroke="#967654" stroke-width="2"/><rect x="640" y="200" width="490" height="260" fill="#e0e6db" stroke="#967654" stroke-width="2"/><text x="120" y="267" class="h">Weight allowance</text><text x="120" y="340" class="t">Cargo + packing</text><text x="120" y="390" class="s">Check the permitted payload.</text><text x="690" y="267" class="h">Space allowance</text><text x="690" y="340" class="t">Bundle layout + access</text><text x="690" y="390" class="s">Check the usable dimensions.</text><text x="170" y="560" class="t">Plan against both limits before confirming sheet counts.</text><text x="170" y="610" class="s">Container equipment and packing arrangements vary.</text></svg>