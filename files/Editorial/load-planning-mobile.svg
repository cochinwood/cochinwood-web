<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1020" viewBox="0 0 600 1020"><rect width="600" height="1020" fill="#f4f1e8"/><g font-family="Arial,sans-serif" fill="#1b4332"><text x="40" y="58" font-size="34" font-weight="700"><tspan x="40" dy="0">Two limits shape a </tspan><tspan x="40" dy="46">container load </tspan></text><rect x="40" y="160" width="520" height="245" fill="#e0e6db" stroke="#967654" stroke-width="2"/><text x="65" y="225" font-size="33" font-weight="700"><tspan x="65" dy="0">Weight allowance </tspan></text><text x="65" y="290" font-size="29" font-weight="400"><tspan x="65" dy="0">Cargo + packing </tspan></text><text x="65" y="355" font-size="26" font-weight="400"><tspan x="65" dy="0">Check the permitted payload. </tspan></text><rect x="40" y="460" width="520" height="245" fill="#e0e6db" stroke="#967654" stroke-width="2"/><text x="65" y="525" font-size="33" font-weight="700"><tspan x="65" dy="0">Space allowance </tspan></text><text x="65" y="590" font-size="29" font-weight="400"><tspan x="65" dy="0">Bundle layout + access </tspan></text><text x="65" y="655" font-size="26" font-weight="400"><tspan x="65" dy="0">Check the usable dimensions. </tspan></text><text x="40" y="795" font-size="28" font-weight="400"><tspan x="40" dy="0">Plan against both limits before </tspan><tspan x="40" dy="38">confirming sheet counts. </tspan></text><text x="40" y="915" font-size="25" font-weight="400"><tspan x="40" dy="0">Container equipment and packing </tspan><tspan x="40" dy="34">arrangements vary. </tspan></text></g></svg>